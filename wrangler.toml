name = "kokab-bingo"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Serve the game (public/index.html) as static files, send /api/* to the worker
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# The game's engines — REQUIRED for worker.js to deploy and run
[durable_objects]
bindings = [
  { name = "BANK", class_name = "Bank" },
  { name = "HALL", class_name = "BingoHall" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Bank", "BingoHall"]

# Public settings (secrets like TELEGRAM_BOT_TOKEN are set in the dashboard, not here)
[vars]
DEMO_MODE = "true"              # set to "false" before taking real players
CARTELA_SEED = "kokab-2025-s1"  # must match the seed inside index.html

# Your D1 database — the game doesn't use it, so it's switched off here.
# It's not deleted; it just isn't part of this app.
