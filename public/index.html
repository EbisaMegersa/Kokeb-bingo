<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo,useCallback,useContext,createContext} = React;

/* ================================================================
   1. SHARED MATH — cartela generation (MUST match worker.js exactly)
      Same seed ⇒ cartela #7 is always the same card. The server
      regenerates and verifies every card itself, so this local copy
      is only used for previews.
================================================================ */
const CARTELA_SEED = 'kokab-2025-s1'; // keep in sync with wrangler.toml
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function genCartela(no){
  const rng=mulberry32(hashStr(CARTELA_SEED+':'+no));
  const card=[];
  for(let c=0;c<5;c++){                      // B:1-15  I:16-30  N:31-45  G:46-60  O:61-75
    const pool=Array.from({length:15},(_,i)=>c*15+i+1);
    for(let k=0;k<5;k++){const j=k+Math.floor(rng()*(15-k));const t=pool[k];pool[k]=pool[j];pool[j]=t;}
    for(let r=0;r<5;r++)card[r*5+c]=pool[r];
  }
  return card;                               // index 12 = centre = FREE
}

/* ================================================================
   2. AMHARIC — number words, column letters, speech
================================================================ */
const AM1=['','አንድ','ሁለት','ሶስት','አራት','አምስት','ስድስት','ሰባት','ስምንት','ዘጠኝ'];
const AM10=['','አስር','ሃያ','ሰላሳ','አርባ','ሃምሳ','ስልሳ','ሰባ'];
const amNum=n=>{ if(n<10)return AM1[n]; const t=(n/10)|0,o=n%10;
  return t===1?'አስራ '+AM1[o]:AM10[t]+(o?' '+AM1[o]:''); };   // 20→ሃያ · 66→ስልሳ ስድስት · 75→ሰባ አምስት
const AM_LET=['ብ','ኢ','ን','ጂ','ኦ'];                       // B I N G O in Amharic
const COLS=[
  {c:'#14B8A6',hi:'#5EEAD4',lo:'#0F766E'},
  {c:'#EC4899',hi:'#F9A8D4',lo:'#BE185D'},
  {c:'#8B5CF6',hi:'#C4B5FD',lo:'#6D28D9'},
  {c:'#F59E0B',hi:'#FDE68A',lo:'#B45309'},
  {c:'#38BDF8',hi:'#BAE6FD',lo:'#0369A1'},
];
const colOf=n=>Math.floor((n-1)/15);
const fmt=n=>(n||0).toLocaleString('en-US');
/* Amharic TTS — voices load async on many devices, so we cache them and
   refresh on the voiceschanged event. If the device has no Amharic voice,
   we simply stay silent: the big visual call is the primary channel. */
let AM_VOICES=[];
try{
  if('speechSynthesis' in window){
    const upd=()=>{AM_VOICES=speechSynthesis.getVoices()
      .filter(v=>(v.lang||'').toLowerCase().startsWith('am'));};
    upd(); speechSynthesis.onvoiceschanged=upd;
  }
}catch(e){}
function speakAm(text){
  try{
    if(!AM_VOICES.length)return;
    const u=new SpeechSynthesisUtterance(text);
    u.lang='am-ET'; u.rate=.95; u.voice=AM_VOICES[0];
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ================================================================
   3. SOUND — tiny WebAudio synth
================================================================ */
const Sfx=(()=>{
  let ctx=null,on=true;
  const ac=()=>{try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();return ctx;}catch(e){return null;}};
  const env=(g,t,a,d,p)=>{g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(p,t+a);
    g.gain.exponentialRampToValueAtTime(.0001,t+a+d);};
  function tone(f0,f1,dur,type='sine',peak=.18,when=0){if(!on)return;const c=ac();if(!c)return;
    const t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    env(g,t,.004,dur,peak);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05);}
  function noise(dur,peak,fc,when=0){if(!on)return;const c=ac();if(!c)return;
    const t=c.currentTime+when,n=c.createBufferSource(),
    buf=c.createBuffer(1,Math.max(1,c.sampleRate*dur|0),c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    n.buffer=buf;const f=c.createBiquadFilter();f.type='lowpass';
    f.frequency.setValueAtTime(fc,t);f.frequency.exponentialRampToValueAtTime(Math.max(60,fc*.3),t+dur);
    const g=c.createGain();env(g,t,.003,dur,peak);n.connect(f);f.connect(g);g.connect(c.destination);n.start(t);}
  return{
    set on(v){on=v;},get on(){return on;},resume(){ac();},
    pop(){tone(520,180,.12,'sine',.24);noise(.05,.1,1400);},
    splat(soft){noise(soft?.08:.12,soft?.07:.13,900);tone(220,90,.08,'triangle',soft?.05:.08);},
    tick(){tone(900,null,.04,'square',.045);},
    ping(){tone(880,660,.18,'sine',.1);},
    fanfare(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,null,.22,'triangle',.15,i*.13));
      tone(1318.5,null,.5,'sine',.09,.52);noise(.4,.05,3200,.52);},
  };
})();

/* ================================================================
   4. TELEGRAM helpers + API layer
================================================================ */
const TG=()=>window.Telegram&&window.Telegram.WebApp;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
          set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function myId(){const u=TG()&&TG().initDataUnsafe&&TG().initDataUnsafe.user;
  return u?('tg'+u.id):('dev'+(ls.get('kb-dev-n')||'1001'));}
const hap=(t='light')=>{try{TG().HapticFeedback.impactOccurred(t)}catch(e){}};
const hapNotif=(t='success')=>{try{TG().HapticFeedback.notificationOccurred(t)}catch(e){}};
const hdrs=extra=>({'x-init-data':(TG()&&TG().initData)||'',
  'x-dev-user':'Dev Player#'+(ls.get('kb-dev-n')||'1001'),...(extra||{})});
const api={
  summary:()=>fetch('/api/summary',{headers:hdrs()}).then(r=>r.json()),
  state:st=>fetch('/api/state?stake='+st,{headers:hdrs()}).then(r=>r.json()),
  join:(stake,cartela)=>fetch('/api/join',{method:'POST',
    headers:hdrs({'content-type':'application/json'}),body:JSON.stringify({stake,cartela})}).then(r=>r.json()),
  deposit:()=>fetch('/api/deposit',{method:'POST',headers:hdrs()}).then(r=>r.json()),
  withdraw:amt=>fetch('/api/withdraw',{method:'POST',
    headers:hdrs({'content-type':'application/json'}),body:JSON.stringify({amount:amt})}).then(r=>r.json()),
};
function useTick(ms){const [,f]=useState(0);
  useEffect(()=>{const t=setInterval(()=>f(x=>x+1),ms);return()=>clearInterval(t);},[ms]);}

/* ================================================================
   5. ICONS (inline SVG, no emoji)
================================================================ */
const ICONS={
  coin:<><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/></>,
  users:<><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.7-3 3.3-4.5 6.5-4.5s5.8 1.5 6.5 4.5"/><path d="M16 5.5a3.5 3.5 0 0 1 0 6.6"/><path d="M17.5 15.6c2.2.5 3.6 1.9 4 4.4"/></>,
  clock:<><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></>,
  volume:<><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15 9a4.5 4.5 0 0 1 0 6"/><path d="M17.5 6.5a8 8 0 0 1 0 11"/></>,
  volumeX:<><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></>,
  x:<path d="M6 6l12 12M18 6 6 18"/>,
  chevron:<path d="M6 9l6 6 6-6"/>,
  check:<path d="M4.5 12.5l5 5L19.5 7"/>,
  arrowLeft:<path d="M19 12H5M11.5 18.5 5 12l6.5-6.5"/>,
  trophy:<><path d="M8 21h8M12 17.5V21M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v.8a3.2 3.2 0 0 0 3.2 3.2M17 6h3v.8a3.2 3.2 0 0 1-3.2 3.2"/></>,
  grid:<><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></>,
  shuffle:<><path d="M3 7h4l10 10h4M21 17l-3-3m3 3-3 3M3 17h4l3-3M14 7h7M21 7l-3-3m3 3-3 3"/></>,
  lock:<><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></>,
  crown:<><path d="M2.8 18 2 6.5l5.5 4L12 3.5l4.5 7 5.5-4L21.2 18z"/><path d="M4 21h16"/></>,
  info:<><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></>,
  star:<path d="M12 3l2.7 5.8 6.3.7-4.7 4.2 1.3 6.2L12 16.8 6.4 19.9l1.3-6.2L3 9.5l6.3-.7z"/>,
};
const Icon=({n,size=18,className='',fill})=>(
  <svg viewBox="0 0 24 24" width={size} height={size} fill={fill?'currentColor':'none'}
    stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
    className={className} aria-hidden="true">{ICONS[n]}</svg>);

/* ================================================================
   6. ATOMS — Ball, Machine, Modal, Chip, Confetti…
================================================================ */
function Ball({n,letter,icon,color,size=56,dim,className='',style={}}){
  if(dim)return <div className={'rounded-full bg-white/[0.07] border border-white/10 grid place-items-center font-display font-bold text-white/35 '+className}
    style={{width:size,height:size,fontSize:Math.max(9,size*.36),...style}}>{n}</div>;
  const t=color||(letter!=null?{c:'#FDE68A',hi:'#FFFBEB',lo:'#D97706'}:icon?{c:'#F59E0B',hi:'#FDE68A',lo:'#B45309'}:COLS[colOf(n)]);
  return <div role="img" aria-label={icon?'Lucky ball':letter!=null?'ኳስ '+letter:'ኳስ '+AM_LET[colOf(n)]+' '+n}
    className={'relative rounded-full grid place-items-center shrink-0 '+className}
    style={{width:size,height:size,
      background:`radial-gradient(circle at 32% 26%, ${t.hi}, ${t.c} 52%, ${t.lo} 100%)`,
      boxShadow:`0 ${Math.round(size/10)}px ${Math.round(size/5)}px rgba(0,0,0,.35), inset -${Math.round(size/22)}px -${Math.round(size/12)}px ${Math.round(size/8)}px rgba(0,0,0,.22), inset ${Math.round(size/16)}px ${Math.round(size/14)}px ${Math.round(size/7)}px rgba(255,255,255,.25)`,
      ...style}}>
    <div className="rounded-full grid place-items-center font-display font-extrabold text-ink"
      style={{width:'74%',height:'74%',background:'radial-gradient(circle at 35% 30%, #ffffff, #EAE7F7)',
        boxShadow:'inset 0 2px 4px rgba(30,27,75,.18)'}}>
      {icon?<Icon n={icon} size={Math.round(size*.32)} className="text-gold"/>
          :<span style={{fontSize:letter!=null?size*.3:(n>9?size*.3:size*.34),lineHeight:1}}>{letter??n}</span>}
    </div>
    <span aria-hidden="true" className="absolute rounded-full bg-white/80 blur-[1px]"
      style={{width:Math.max(3,size*.07),height:Math.max(3,size*.07),left:'27%',top:'15%'}}/>
  </div>;
}
function BallSlot({size=80}){
  return <div aria-hidden="true" className="rounded-full border-2 border-dashed border-white/20 grid place-items-center shrink-0"
    style={{width:size,height:size}}>
    <span className="font-display font-extrabold text-white/25" style={{fontSize:size*.34}}>—</span></div>;
}
function Machine({size=88,spinning}){
  const balls=[[22,24,3],[54,16,22],[70,48,41],[36,60,56],[12,52,64],[58,74,12]];
  return <div className="relative shrink-0" style={{width:size,height:size}} aria-hidden="true">
    <div className="absolute inset-0 rounded-full border-2 border-dashed border-white/20 cage-spin" style={{animationDuration:spinning?'4s':'16s'}}/>
    <div className="absolute inset-[15%] rounded-full border border-dashed border-white/10 cage-rev" style={{animationDuration:spinning?'3s':'11s'}}/>
    <div className="absolute inset-[30%] rounded-full" style={{background:'radial-gradient(circle at 40% 35%, rgba(255,255,255,.08), rgba(30,27,75,.5))'}}/>
    {balls.map((b,k)=>(
      <div key={k} className="absolute" style={{left:b[0]+'%',top:b[1]+'%'}}>
        <div className="ball-bob" style={{animationDelay:(k*.45)+'s',animationDuration:(2.2+k*.35)+'s'}}>
          <Ball n={b[2]} size={Math.max(10,Math.round(size*.16))}/>
        </div>
      </div>))}
  </div>;
}
function Chip({children,tone='def',className=''}){
  const tones={def:'bg-white/[0.06] border-white/10 text-white/70',
    gold:'bg-gold/15 border-gold/30 text-gold-lite',
    teal:'bg-teal/15 border-teal/30 text-teal-lite',
    pink:'bg-pink/15 border-pink/40 text-pink'};
  return <span className={'inline-flex items-center gap-1 rounded-full border px-2.5 py-1 text-[11px] font-semibold '+tones[tone]+' '+className}>{children}</span>;
}
function Modal({title,onClose,children}){
  useEffect(()=>{ if(!onClose)return;
    const k=e=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',k);return()=>window.removeEventListener('keydown',k);
  },[onClose]);
  return <div className="fixed inset-0 z-[70] grid place-items-center p-4">
    <div className="absolute inset-0 bg-ink/80 backdrop-blur-sm" onClick={onClose||undefined}/>
    <div role="dialog" aria-modal="true" aria-label={title} className="panel relative w-full max-w-sm p-6 modal-in">
      {onClose&&<button className="iconbtn absolute right-3 top-3 w-8 h-8" onClick={onClose} aria-label="Close"><Icon n="x" size={16}/></button>}
      {children}
    </div>
  </div>;
}
function CountRing({n,total=45}){
  const R=40,C=2*Math.PI*R,pct=Math.max(0,Math.min(1,n/total));
  return <svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label={n+' ሰከንድ'}>

    <circle cx="52" cy="52" r={R} fill="none" stroke="#F59E0B" strokeWidth="8" strokeLinecap="round"
      strokeDasharray={C} strokeDashoffset={C*(1-pct)} transform="rotate(-90 52 52)"/>
    <text x="52" y="54" textAnchor="middle" dominantBaseline="middle" fill="#fff"
      style={{font:'700 40px "Baloo 2", cursive'}}>{n}</text>
  </svg>;
}
function Confetti({fireKey}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!fireKey)return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const cv=ref.current;if(!cv)return;
    const ctx=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight;
    const colors=['#EC4899','#F59E0B','#14B8A6','#8B5CF6','#38BDF8','#FDE68A','#ffffff'];
    const P=[];
    const burst=(x,y,ang,spread,count,sp)=>{for(let i=0;i<count;i++){
      const a=ang+(Math.random()-.5)*spread,v=sp*(.5+Math.random());
      P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*6,h:8+Math.random()*8,
        rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,c:colors[i%colors.length],
        ph:Math.random()*Math.PI,ps:.15+Math.random()*.2,shape:Math.random()<.3});}};
    burst(W/2,H*.42,-Math.PI/2,Math.PI*.9,110,11);
    burst(0,H+10,-Math.PI/3,.7,70,15);burst(W,H+10,-Math.PI*2/3,.7,70,15);
    let raf,t0=null,last=0;
    const step=t=>{if(t0==null){t0=t;last=t;}const dt=Math.min(40,t-last)/16.7;last=t;
      ctx.clearRect(0,0,W,H);
      for(const p of P){p.vy+=.16*dt;p.vx*=Math.pow(.99,dt);p.vy*=Math.pow(.995,dt);
        p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.ph+=p.ps*dt;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
        if(p.shape){ctx.beginPath();ctx.arc(0,0,p.w/2,0,7);ctx.fill();}
        else{ctx.scale(1,Math.max(.15,Math.abs(Math.sin(p.ph))));ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);}
        ctx.restore();}
      for(let i=P.length-1;i>=0;i--)if(P[i].y>H+30)P.splice(i,1);
      if(P.length&&t-t0<4500)raf=requestAnimationFrame(step);else ctx.clearRect(0,0,W,H);};
    raf=requestAnimationFrame(step);
    return()=>cancelAnimationFrame(raf);
  },[fireKey]);
  return <canvas ref={ref} className="fixed inset-0 z-[65] pointer-events-none" aria-hidden="true"/>;
}

      <div className="panel p-6 text-center">
        <Icon n="lock" size={26} className="text-gold mx-auto"/>
        <p className="font-display font-bold text-lg mt-2">ሽያጩ ተዘጋል · Sales closed</p>
        <p className="text-sm text-white/50 mt-1">ዙር {round} እየተጫወተ ነው — ቀጣዩ ዙር ካርቴላ ሲከፈት ይደርሳል።</p>
        <button className="btn btn-ghost text-sm mt-4" onClick={()=>go('game')}>ጨዋታውን ተመልከት · Watch live</button>
      </div>
    :<>
      {/* sales open: the 400-cartela board */}
      <div className="flex items-center gap-2 mb-3">
        <p className="text-xs text-white/50 flex-1">
          ነጣ <span className="text-white/80 font-bold">{freeN}</span> የተወሰዱ <span className="text-white/60">{taken.size}</span>
        </p>
        <button className="btn btn-ghost text-xs px-3 py-1.5" disabled={busy} onClick={()=>join('auto')}>
          <Icon n="shuffle" size={13}/> በራስ-ሰር ምረጥ
        </button>
      </div>
      <div className="grid grid-cols-8 gap-1.5" role="group" aria-label="ካርቴላ ምረጥ · choose your cartela">
        {Array.from({length:400},(_,i)=>i+1).map(n=>{
          const t=taken.has(n);
          return <button key={n} disabled={t||busy} onClick={()=>{setSel(n);hap('light');}}
            className={'aspect-square rounded-lg grid place-items-center font-display font-bold text-[13px] relative transition-all '
              +(t?'bg-white/[0.04] text-white/25':'bg-white/[0.08] text-white/85 hover:bg-white/[0.14] active:scale-95')
              +(sel===n&&!t?' ring-2 ring-gold':'')}
            aria-label={'ካርቴላ '+n+(t?' · የተወሰደ':'')}>
            {n}
            {t&&<Icon n="check" size={9} className="absolute bottom-0.5 right-0.5 text-white/30"/>}
          </button>;})}
      </div>
      <p className="text-[10px] text-white/30 text-center mt-3">
        እያንዳንዱ ካርቴላ በዙሩ ውስጥ ለአንድ ተጫዋች ብቻ ነው — በሌላ ተጫዋች ከያዘው መውሰድ አይቻልም።<br/>
        Each cartela belongs to one player per round — exactly like the paper cards.
      </p>
    </>}

    {/* sticky preview + take bar */}
    {sel&&!taken.has(sel)&&!my&&phase!=='playing'&&phase!=='ended'&&
      <div className="sticky bottom-3 z-30 mt-3">
        <div className="panel !bg-ink2/95 p-3 flex items-center gap-3 shadow-2xl">
          <MiniCard card={genCartela(sel)}/>
          <div className="flex-1 min-w-0">
            <p className="font-display font-bold leading-tight">ካርቴላ #{sel}</p>
            <p className="text-[11px] text-white/45">This exact card · {fmt(stake)} ብር</p>
            <p className="text-[11px] text-white/35">ካርቴላው በኋላ {fmt(Math.max(0,bal-stake))} ብር ይቀራል</p>
          </div>
          <button className="btn btn-primary text-sm px-4 shrink-0" disabled={busy} onClick={()=>join(sel)}>ውሰድ · Take</button>
          <button className="iconbtn w-8 h-8 shrink-0" onClick={()=>setSel(null)} aria-label="Dismiss"><Icon n="x" size={14}/></button>
        </div>
      </div>}
  </>;
}

function GameScreen({stake}){
  const {refresh,toast,go,isTg,sound,toggleSound}=useApp();
  const [hall,setHall]=useState(null);
  const [daubs,setDaubs]=useState(()=>Array.from({length:25},(_,i)=>i===12));
  const [auto,setAuto]=useState(false);
  const [winSet,setWinSet]=useState(null);
  const [shake,setShake]=useState(-1);
  const [burst,setBurst]=useState(0);
  const off=useRef(0),seen=useRef(0),firstSync=useRef(true),celebrated=useRef(0),lastPhase=useRef(''),wasIn=useRef(false);
  useTick(500);

  /* poll the hall — fast while playing, relaxed otherwise */
  useEffect(()=>{ let stop=false;
    (async()=>{ while(!stop){
      const s=await api.state(stake).catch(()=>null);
      if(stop)break;
      if(s&&s.ok){
        off.current=s.serverNow-Date.now();
        setHall(s);
        if(s.my)wasIn.current=true;
        const dlen=(s.draws||[]).length;
        if(firstSync.current){seen.current=dlen;firstSync.current=false;}
        else if(dlen>seen.current&&s.phase==='playing'){
          seen.current=dlen; Sfx.pop(); hap('medium');
          const b=s.draws[dlen-1];
          if(Sfx.on)speakAm(AM_LET[colOf(b)]+' '+amNum(b));   // "ብ አስራ አራት"
        } else seen.current=dlen;
        if(s.winner&&s.winner.round===s.round&&celebrated.current!==s.round){
          celebrated.current=s.round;
          const iWon=s.winner.winners.some(w=>w.userId===myId());
          if(iWon){setBurst(x=>x+1);Sfx.fanfare();hapNotif('success');setWinSet(new Set(Array.from({length:25},(_,i)=>i)));}
          else{Sfx.ping();hap('light');}
          refresh();
        }
        if(lastPhase.current==='ended'&&s.phase==='lobby'&&wasIn.current){
          wasIn.current=false; firstSync.current=true; refresh(); go('pick');
        }
        lastPhase.current=s.phase;
      }
      await new Promise(r=>setTimeout(r,(s&&s.phase==='playing')?1200:2500));
    }})();
    return()=>{stop=true;};
  },[stake]);

  /* ask Telegram before closing mid-round */
  useEffect(()=>{ try{
    const tg=TG();
    if(hall&&hall.my&&(hall.phase==='playing'||hall.phase==='countdown'))
      tg&&tg.enableClosingConfirmation&&tg.enableClosingConfirmation();
    else tg&&tg.disableClosingConfirmation&&tg.disableClosingConfirmation();
  }catch(e){} },[hall&&hall.phase,hall&&!!hall.my]);

  const card=hall&&hall.my?hall.my.card:null;
  const calledSet=useMemo(()=>new Set(hall?hall.draws:[]),[hall]);
  const phase=hall?hall.phase:'lobby';
  const iWon=hall&&hall.winner&&hall.winner.round===hall.round&&hall.winner.winners.some(w=>w.userId===myId());

  /* fresh card state whenever a new round or new cartela begins */
  const rk=hall?(hall.round+'-'+(hall.my?hall.my.cartela:'x')):'';
  useEffect(()=>{ setDaubs(Array.from({length:25},(_,i)=>i===12)); setWinSet(null); },[rk]);

  /* auto-daub trails each call by a beat (cosmetic — the server calls wins) */
  useEffect(()=>{ if(!auto||!card||phase!=='playing')return;
    const t=setTimeout(()=>{
      setDaubs(ds=>{let ch=false;
        const nd=ds.map((d,i)=>{if(!d&&i!==12&&calledSet.has(card[i])){ch=true;return true;}return d;});
        if(ch)Sfx.splat(true); return ch?nd:ds;});
    },350);
    return()=>clearTimeout(t);
  },[auto,card,phase,hall&&hall.draws&&hall.draws.length]);

  /* manual daub — only numbers already called may be splatted */
  const onDaub=i=>{
    if(phase!=='playing'||!card||i===12||daubs[i])return;
    if(!calledSet.has(card[i])){setShake(i);setTimeout(()=>setShake(-1),350);return;}
    setDaubs(ds=>{const nd=[...ds];nd[i]=true;return nd;});
    Sfx.splat(); hap('light');
  };

  const secs=phase==='countdown'&&hall?Math.max(0,Math.ceil((hall.startAt-(Date.now()+off.current))/1000)):0;

  if(!hall)return <p className="text-center text-white/40 py-20 text-sm">እየተጫነ… · Loading…</p>;

  return <>
    <Confetti fireKey={burst}/>
    {/* info bar */}
    <div className="flex items-center gap-2 pt-5 pb-3">
      {!isTg&&<button className="iconbtn" onClick={()=>go('pick')} aria-label="Back"><Icon n="arrowLeft"/></button>}
      <Chip tone="pink">{stake} ብር</Chip>
      <Chip>ዙር {hall.round}</Chip>
      <div className="flex-1"/>
      <div className="text-right">
        <p className="text-[9px] uppercase tracking-widest text-white/40 font-bold leading-none">ሽልማት · Pot</p>
        <p className="font-display font-extrabold text-lg shimmer-text leading-tight">{fmt(hall.pot)} ብር</p>
      </div>
      <Chip><Icon n="users" size={11}/>{hall.players}</Chip>
      <button className="iconbtn" onClick={toggleSound} aria-label={sound?'Mute':'Unmute'}><Icon n={sound?'volume':'volumeX'}/></button>
    </div>

    <CallerPanel hall={hall}/>

    {/* my cartela — or the spectator panel */}
    {hall.my? <>
      <div className="flex items-center gap-2 mt-4 mb-2 flex-wrap">
        <Chip tone="gold"><Icon n="grid" size={11}/>ካርቴላ #{hall.my.cartela}</Chip>
        <Chip tone="teal">ሙሉ ካርቴላ · Full house</Chip>
        <div className="flex-1"/>
        <AutoSwitch auto={auto} setAuto={setAuto}/>
      </div>
      <div className="relative">
        <Cartela card={hall.my.card} daubs={daubs} calledSet={calledSet} winSet={winSet}
          onDaub={onDaub} playing={phase==='playing'} shake={shake}/>
        {phase==='countdown'&&(
          <div className="absolute inset-0 z-10 rounded-2xl bg-ink/75 backdrop-blur-[2px] grid place-items-center">
            <div className="text-center">
              <CountRing n={secs} total={45}/>
              <p className="font-display font-bold text-lg mt-3">ዙሩ ይጀምራል…</p>
              <p className="text-xs text-white/50 mt-1">{hall.players} ተጫዋች · ሽልማት {fmt(hall.pot)} ብር</p>
            </div>
          </div>)}
      </div>
      <p className="text-center text-[10px] text-white/35 mt-2">
        ወርቃማ ቀለበት = የተጠራ ቁጥር · gold ring = called, tap to splat — ስርዓቱ ቢንጎህን ራሱ ይጮሃል።
      </p>
    </>:(
      <div className="panel p-6 text-center mt-4">
        <Ball icon="star" size={44} className="mx-auto"/>
        <p className="font-display font-bold text-lg mt-2">{phase==='lobby'?'ዙሩ አልጀመረም':'በዚህ ዙር ካርቴላ የለህም'}</p>
        <p className="text-sm text-white/50 mt-1">
          {phase==='lobby'?'ካርቴላ ውሰደህ ወደ ጨዋታ ግባ':'No cartela this round — sales open for the next one'}</p>
        {phase==='lobby'
          ?<button className="btn btn-primary text-sm mt-4" onClick={()=>go('pick')}>ካርቴላ ውሰድ · Take one</button>
          :<button className="btn btn-ghost text-sm mt-4" onClick={()=>go('home')}>ወደ መነሻ · Home</button>}
      </div>)}

    {/* winner overlay */}
    {phase==='ended'&&hall.winner&&(
      <Modal title={iWon?'BINGO':'Winner'}>
        {iWon?(
          <div className="text-center space-y-2 pt-2">
            <div className="flex justify-center gap-1">
              {'BINGO'.split('').map((ch,i)=>(
                <span key={i} className="font-display font-extrabold text-4xl inline-block"
                  style={{color:COLS[i].c,transform:`rotate(${(i-2)*4}deg)`}}>{ch}</span>))}
            </div>
            <p className="text-white/60 text-sm">ሙሉ ካርቴላ በ{hall.winner.balls} ኳስ · full house in {hall.winner.balls} balls!</p>
            <p className="font-display font-extrabold text-5xl shimmer-text">+{fmt(hall.winner.amountEach)} ብር</p>
            <p className="text-[11px] text-white/40">ካርቴላ #{hall.winner.winners.map(w=>w.cartela).join(' & ')} · ገንዘብ ወደ ሂሳብህ ገብቷል</p>
            <button className="btn btn-primary mt-2" onClick={()=>{firstSync.current=true;go('pick');}}>ቀጣይ ዙር · Next round</button>
          </div>
        ):(
          <div className="text-center space-y-2 pt-2">
            <Icon n="crown" size={34} className="text-gold mx-auto"/>
            <p className="font-display font-bold text-xl">{hall.winner.winners.map(w=>w.name).join(' & ')} አሸነፈ!</p>
            <p className="text-white/55 text-sm">took the pot · ካርቴላ #{hall.winner.winners.map(w=>w.cartela).join(' & ')}</p>
            <p className="font-display font-extrabold text-3xl text-gold-lite">+{fmt(hall.winner.amountEach)} ብር</p>
            <p className="text-xs text-white/40">በ{hall.winner.balls} ኳስ · full house</p>
            <button className="btn btn-ghost mt-2" onClick={()=>go('home')}>ተመለስ · OK</button>
          </div>
        )}
      </Modal>)}
  </>;
}

/* ================================================================
   10. MODALS — deposit / withdraw
================================================================ */
function DepositModal({onClose}){
  const {sum,refresh,toast}=useApp();
  const [busy,setBusy]=useState(false);
  const demo=sum&&sum.demo;
  return <Modal title="ገንዘብ ማስገባት · Deposit" onClose={onClose}>
    <div className="text-center">
      <Ball icon="coin" size={64} className="mx-auto"/>
      {demo?<>
        <p className="font-display font-bold text-lg mt-3">የሙከራ ሙላት · Demo top-up</p>
        <p className="text-sm text-white/55 mt-1">Demo mode is on — take 500 ብር and test the tables.</p>
        <button className="btn btn-primary w-full mt-4" disabled={busy} onClick={async()=>{
          setBusy(true); const r=await api.deposit().catch(()=>null); setBusy(false);
          if(r&&r.ok){refresh();toast('+500 ብር ተጨመረ · balance topped up','coin');onClose();}
          else toast('አልተሳካም · deposit failed','x');
        }}><Icon n="coin" size={15}/> +500 ብር</button>
      </>:<>
        <p className="font-display font-bold text-lg mt-3">Telebirr · Chapa</p>
        <p className="text-sm text-white/55 mt-1 leading-relaxed">
          Deposits arrive via Telebirr or Chapa. Until the payment webhook is wired on the server, send your top-up to the operator and it will be confirmed manually — ping the admin in the group.</p>
        <p className="text-[11px] text-white/35 mt-3">Operator: wire <span className="text-gold-lite">/api/payment-webhook</span> for instant automatic credits.</p>
      </>}
    </div>
  </Modal>;
}
function WithdrawModal({onClose}){
  const {sum,refresh,toast}=useApp();
  const [amt,setAmt]=useState(''),[busy,setBusy]=useState(false);
  const bal=sum?sum.balance:0;
  const submit=async()=>{
    const n=parseInt(amt,10);
    if(!(n>=25))return toast('ቢያንስ 25 ብር · minimum is 25 ብር','x');
    if(n>bal)return toast('በቂ ገንዘብ የለም · not enough balance','x');
    setBusy(true); const r=await api.withdraw(n).catch(()=>null); setBusy(false);
    if(r&&r.ok){toast('ጥያቄ ተላከ · request sent — the operator will confirm','check');onClose();refresh();}
    else toast('አልተሳካም · try again','x');
  };
  return <Modal title="ገንዘብ ማውጣት · Withdraw" onClose={onClose}>
    <div className="text-center">
      <p className="text-sm text-white/55">ቀሪ ሂሳብ · balance <span className="text-gold-lite font-bold">{fmt(bal)} ብር</span></p>
      <input type="number" min="25" className="input mt-3 text-center font-display font-bold text-lg"
        placeholder="መጠን · amount" value={amt} onChange={e=>setAmt(e.target.value)} aria-label="Amount"/>
      <button className="btn btn-primary w-full mt-3" disabled={busy} onClick={submit}>ጥያቄ ላክ · Request</button>
      <p className="text-[11px] text-white/35 mt-3">Paid to your Telebirr · reviewed by the operator · min 25 ብር</p>
    </div>
  </Modal>;
}

/* Browser-testing badge — cycles between 6 fake players so you can test
   cartela exclusivity in two tabs. Never shows inside Telegram. */
function DevBadge(){
  const cycle=()=>{
    const n=(((parseInt(ls.get('kb-dev-n')||'1001',10)-1000)%6)+1001);
    ls.set('kb-dev-n',String(n)); location.reload();
  };
  return <button onClick={cycle}
    className="fixed bottom-3 right-3 z-50 bg-ink2/95 border border-white/15 rounded-full pl-3 pr-2 py-1.5 text-[10px] font-bold text-white/60 flex items-center gap-1">
    Browser test · Player #{ls.get('kb-dev-n')||'1001'} <Icon n="chevron" size={10} className="-rotate-90"/>
  </button>;
}

/* ================================================================
   11. APP — routing, Telegram wiring, global poll
================================================================ */
function App(){
  const [screen,setScreen]=useState('home');
  const [stake,setStake]=useState(10);
  const [sum,setSum]=useState(null);
  const [depositOpen,setDepositOpen]=useState(false);
  const [withdrawOpen,setWithdrawOpen]=useState(false);
  const [toasts,setToasts]=useState([]);
  const [sound,setSound]=useState(()=>ls.get('kb-snd')!=='off');
  const isTg=!!(TG()&&TG().initData);

  useEffect(()=>{ const tg=TG(); if(!tg)return;
    try{tg.ready();tg.expand();tg.setHeaderColor('#1E1B4B');tg.setBackgroundColor('#1E1B4B');}catch(e){} },[]);
  useEffect(()=>{ Sfx.on=sound; ls.set('kb-snd',sound?'on':'off'); },[sound]);
  useEffect(()=>{ const un=()=>Sfx.resume();
    window.addEventListener('pointerdown',un,{once:true}); return()=>window.removeEventListener('pointerdown',un); },[]);

  /* Telegram BackButton ↔ in-app screens */
  useEffect(()=>{ const tg=TG(); if(!tg||!tg.onEvent)return;
    const h=()=>setScreen(s=>s==='game'?'pick':s==='pick'?'home':'home');
    tg.onEvent('backButtonClicked',h);
    return()=>tg.offEvent('backButtonClicked',h);
  },[]);
  useEffect(()=>{ const tg=TG(); if(!tg||!tg.BackButton)return;
    try{screen==='home'?tg.BackButton.hide():tg.BackButton.show();}catch(e){} },[screen]);

  /* global state poll (balance, both halls, recent winners) */
  const refresh=useCallback(async()=>{ try{const s=await api.summary(); if(s.ok)setSum(s);}catch(e){} },[]);
  useEffect(()=>{ refresh(); const t=setInterval(refresh,3000); return()=>clearInterval(t); },[]);

  const toast=useCallback((msg,icon='check')=>{ const id=Date.now()+Math.random();
    setToasts(t=>[...t.slice(-2),{id,msg,icon}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3400); },[]);

  const ctx={sum,refresh,toast,sound,toggleSound:()=>setSound(s=>!s),isTg,go:setScreen,
    setStakeAndPick:st=>{setStake(st);setScreen('pick');},
    openDeposit:()=>setDepositOpen(true),openWithdraw:()=>setWithdrawOpen(true)};

  return <AppCtx.Provider value={ctx}>
    <main className="max-w-md mx-auto min-h-screen px-3 pb-10">
      {screen==='home'&&<HomeScreen/>}
      {screen==='pick'&&<PickScreen key={stake+'p'} stake={stake}/>}
      {screen==='game'&&<GameScreen key={stake+'g'} stake={stake}/>}
    </main>
    {depositOpen&&<DepositModal onClose={()=>setDepositOpen(false)}/>}
    {withdrawOpen&&<WithdrawModal onClose={()=>setWithdrawOpen(false)}/>}
    <Toasts toasts={toasts}/>
    {!isTg&&<DevBadge/>}
  </AppCtx.Provider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
